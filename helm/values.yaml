namespace: auth

# App configuration
auth:
  name: auth-app
  port: 4000
  grpcPort: 50051
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/auth:latest
    tag: latest
  replicas: 2

  env:
    corsOrigin: "https://k8s-frontend-frontend-fe6f13f88d-1209588435.eu-central-1.elb.amazonaws.com,https://k8s-focus-focusing-a37b3eb8d5-2089895283.eu-central-1.elb.amazonaws.com"

# PostgreSQL configuration
postgres:
  serviceName: database
  port: 5432
  image:
    repository: postgres
    tag: "16-alpine"
  database: "auth"
  persistence:
    claimName: auth-postgres-pvc
    size: 1Gi

# RabbitMQ configuration
rabbitmq:
  serviceName: rabbitmq
  port: 5672
  managementPort: 15672
  image:
    repository: rabbitmq
    tag: "4.0-management-alpine"
  persistence:
    claimName: auth-rabbitmq-pvc
    size: 1Gi
  