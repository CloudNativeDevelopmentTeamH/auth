services:
  database:
    container_name: auth-postgres-test
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME?missing db name}
      POSTGRES_USER: ${DB_USERNAME?missing db username}
      POSTGRES_PASSWORD: ${DB_PASSWORD?missing db password}
    ports:
      - "${DB_PORT?missing db port}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    container_name: auth-queue
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER?missing rabbitmq user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?missing rabbitmq password}
    ports:
      - "${RABBITMQ_PORT?missing rabbitmq port}:5672"
      - "${RABBITMQ_UI_PORT?missing rabbitmq ui port}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  app:
    container_name: auth-app-test
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT?missing app port}
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME?missing db name}
      DB_USERNAME: ${DB_USERNAME?missing db username}
      DB_PASSWORD: ${DB_PASSWORD?missing db password}
      JWT_SECRET: ${JWT_SECRET?missing jwt secret}
      PEPPER: ${PEPPER?missing pepper}
      PORT: ${PORT?missing app port}
      GRPC_PORT: ${GRPC_PORT?missing grpc port}
      RABBITMQ_HOST: queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER?missing rabbitmq user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD?missing rabbitmq password}
    ports:
      - "${PORT?missing app port}:${PORT?missing app port}"
      - "${GRPC_PORT?missing grpc port}:${GRPC_PORT?missing grpc port}"
    depends_on:
      database:
        condition: service_healthy
      queue:
        condition: service_healthy

volumes:
  db_data: